name: 🏗️ Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for changelog generation

      - name: 🟢 Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Install EAS CLI
        run: npm install -g eas-cli

      - name: 🏗️ Build APK
        run: eas build --platform android --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 Download APK
        run: |
          APK_URL=$(eas build:list --platform android --limit 1 --json --non-interactive | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8'))[0]?.artifacts?.applicationArchiveUrl || ''")
          if [ -z "$APK_URL" ]; then
            echo "Error: No application archive URL found. The build may have failed."
            exit 1
          fi
          curl -L "$APK_URL" -o resona.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: resona-apk-${{ github.run_number }}
          path: resona.apk
          retention-days: 30

      - name: 📝 Generate Changelog
        run: node scripts/generate-changelog.js > CHANGELOG.md

      - name: 🔑 Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🚀 Create or Update GitHub Release
        run: |
          gh release create "v${{ steps.get_version.outputs.version }}" resona.apk \
            --title "Resona v${{ steps.get_version.outputs.version }}" \
            --notes-file CHANGELOG.md \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
