name: 🏗️ Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Install EAS CLI
        run: npm install -g eas-cli

      - name: 🏗️ Build APK
        run: eas build --platform android --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 Download & upload APK
        run: |
          APK_URL=$(eas build:list --platform android --limit 1 --json --non-interactive | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8'))[0]?.artifacts?.applicationArchiveUrl || ''")
          curl -L "$APK_URL" -o resona.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: resona-apk-${{ github.run_number }}
          path: resona.apk
          retention-days: 30
