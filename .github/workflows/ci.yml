##############################################################################
# Resona — CI / PR Checks
# Runs on every pull request and push to main.
# Validates TypeScript, checks for secrets, and confirms the build compiles.
##############################################################################
name: 🔍 CI – Code Quality

on:
  pull_request:
    branches: [main, release/**]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline

      - name: 🔍 TypeScript type check
        run: npx tsc --noEmit --skipLibCheck
        # skipLibCheck avoids noise from node_modules type issues

  # ─────────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for trufflehog

      - name: 🔐 Scan for secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  # ─────────────────────────────────────────────────────────────────────────────
  validate-version:
    name: Validate version.json
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 📋 Check version.json exists and is valid
        run: |
          if [ ! -f version.json ]; then
            echo "::warning::version.json missing — run: node scripts/bump-version.js"
          else
            node -e "
              const v = require('./version.json');
              console.log('Version:', v.version);
              console.log('versionCode:', v.versionCode);
              if (!v.version || !v.versionCode) process.exit(1);
            "
          fi
